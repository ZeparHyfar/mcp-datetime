[project]
name = "mcp-datetime"
version = "0.2.0"
description = "A MCP server for datetime formatting and file name generation."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["mcp>=2.3,<3"]
license = "MIT"
keywords = ["claude", "mcp", "datetime", "time", "format", "timezone"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[[project.authors]]
name = "ZeparHyfar"
email = "zeparhyfar@gmail.com"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
mcp-datetime = "mcp_datetime:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "anyio>=4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.urls]
Repository = "https://github.com/ZeparHyfar/mcp-datetime"
Changelog = "https://github.com/ZeparHyfar/mcp-datetime/blob/main/CHANGELOG.md"
